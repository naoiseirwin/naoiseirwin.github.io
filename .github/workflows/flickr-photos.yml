name: Refresh Flickr photos

# Flickr's public feed does not allow browser fetches (no CORS header).
# This job writes _data/flickr.json from that keyless feed. A push rebuilds
# the GitHub Pages site, which embeds the list at build time.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch public Flickr feed
        run: python3 scripts/fetch_flickr.py

      - name: Commit updated photo list
        run: |
          if git diff --quiet -- _data/flickr.json; then
            echo "Photo list unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/flickr.json
          git commit -m "Update Flickr photo list"
          git push
